<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>批次成本管理</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-tabs { display:flex;gap:4px;margin-bottom:16px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow) }
    .nav-tab { flex:1;padding:12px;text-align:center;border:none;background:transparent;border-radius:10px;font-size:15px;font-weight:600;color:var(--text-secondary);font-family:inherit;cursor:pointer;transition:.2s }
    .nav-tab.active { background:var(--primary);color:#fff }
    .nav-tab:hover:not(.active) { background:var(--bg) }
    .batch-card { background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s;margin-bottom:10px }
    .batch-card:hover { box-shadow:var(--shadow-lg) }
    .stats-bar { display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap }
    .stat-card { background:var(--card);border-radius:var(--radius);padding:12px 16px;text-align:center;box-shadow:var(--shadow);flex:1;min-width:100px }
    .stat-card .num { font-size:22px;font-weight:700 }
    .stat-card .label { font-size:11px;color:var(--text-secondary);margin-top:2px }
    .mgmt-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px }
    .mgmt-card { background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow) }
    .mgmt-card h3 { margin:0 0 12px;font-size:16px }
    .version-info { text-align:center;color:var(--text-secondary);font-size:12px;margin-top:16px }
    .proc-table { width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow) }
    .proc-table th { background:#8b5cf6;color:#fff;padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap }
    .proc-table td { padding:8px;border-bottom:1px solid var(--border);white-space:nowrap }
    .proc-table tr:hover td { background:#f5f3ff }
    .proc-table .num-col { text-align:right;font-variant-numeric:tabular-nums }
    .report-toolbar { display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px }
    .report-toolbar h2 { margin:0;font-size:18px }
    .report-toolbar p { margin:4px 0 0;color:var(--text-secondary);font-size:12px }
    .report-note { margin-bottom:12px;padding:10px 12px;border:1px solid #a7f3d0;background:#ecfdf5;color:#065f46;border-radius:10px;font-size:12px;line-height:1.6 }
    .report-note.warning { border-color:#fed7aa;background:#fff7ed;color:#9a3412 }
    .report-table th { background:#0f766e }
    .product-table th { background:#0e7490 }
    .report-section-title { margin:16px 0 8px;font-size:16px;color:var(--text) }
    .report-table .batch-col { position:sticky;left:0;z-index:1;background:#fff;font-family:monospace }
    .report-table th.batch-col { z-index:2;background:#0f766e;font-family:inherit }
    .report-table tr:hover td.batch-col { background:#f0fdfa }
    .report-table tfoot td { background:#f0fdfa;font-weight:700;border-top:2px solid #99f6e4 }
    @media (max-width: 768px) {
      .report-toolbar { align-items:flex-start;flex-direction:column }
      .report-toolbar .btn { width:100%!important }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 批次成本管理</h1>
    <p>录入采购与运输信息，按订单批次自动核算成本</p>
  </div>

  <div class="container-wide" id="app">

    <!-- Tab 栏 -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('procurement')" id="tabProcurement">🛒 采购端</button>
      <button class="nav-tab" onclick="switchTab('shipping')" id="tabShipping">🚚 运输端</button>
      <button class="nav-tab" onclick="switchTab('report')" id="tabReport">📊 报表端</button>
    </div>

    <!-- 采购端 -->
    <div id="procSection">
      <div class="stats-bar" id="procStats"></div>
      <div id="procList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
        <button class="btn btn-sm btn-primary" onclick="openProcAdd()" style="width:auto;padding:10px 24px;background:#8b5cf6">➕ 新增采购</button>
        <button class="btn btn-sm btn-outline" onclick="exportProcCSV()" style="width:auto;padding:10px 24px">📤 导出Excel</button>
      </div>
      <div class="pagination" style="margin-top:16px">
        <span class="page-info" id="pageInfo">共 0 条</span>
      </div>
    </div>

    <!-- 运输端 -->
    <div id="shipSection" style="display:none">
      <div class="stats-bar" id="shipStats"></div>
      <div id="shipList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" onclick="openPickupModal()" style="width:auto;padding:10px 20px;background:#f59e0b">➕ 新增提货</button>
        <button class="btn btn-sm btn-primary" onclick="openShipExpenseModal()" style="width:auto;padding:10px 20px;background:#6366f1">💰 新增费用</button>
      </div>
    </div>

    <!-- 报表端 -->
    <div id="reportSection" style="display:none">
      <div class="stats-bar" id="reportStats"></div>
      <div class="report-toolbar">
        <div>
          <h2>订单批次费用报表</h2>
          <p>以采购端订单批次号为基准，逐笔记录采购费用和运输费用</p>
        </div>
        <button class="btn btn-sm btn-primary" onclick="exportBatchReport()" style="width:auto;padding:10px 20px;background:#0f766e">📤 导出报表Excel</button>
      </div>
      <div id="reportNotice"></div>
      <div id="productSummary"></div>
      <div id="reportList"></div>
      <div class="mgmt-grid" style="margin-top:16px">
        <div class="mgmt-card">
          <h3>☁️ 云端同步</h3>
          <div id="cloudSync"></div>
        </div>
        <div class="mgmt-card">
          <h3>📐 报表口径</h3>
          <div id="reportMethod"></div>
        </div>
        <div class="mgmt-card">
          <h3>⚙️ 系统设置</h3>
          <div id="sysSettings"></div>
        </div>
      </div>
      <div class="version-info">批次成本管理 v2.8</div>
    </div>

    <!-- 采购端弹窗 -->
    <div id="procModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeProcModal()">
      <div class="modal-content" style="max-width:600px">
        <button class="modal-close" onclick="closeProcModal()">✕</button>
        <h3 style="margin-bottom:16px">🛒 新增采购记录</h3>
        <form onsubmit="saveProcurement(event)">
          <input type="hidden" id="procEditId">
          <div class="form-row">
            <div class="form-group"><label>下单日期</label><input type="date" class="form-control" id="procDate"></div>
            <div class="form-group"><label>品牌 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procBrand" required placeholder="品牌名称"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>品名 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procProductName" required placeholder="产品名称"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>下单数量</label><input type="number" class="form-control" id="procOrderQty" min="0" step="1" placeholder="0"></div>
            <div class="form-group"><label>产出数量</label><input type="number" class="form-control" id="procOutputQty" min="0" step="1" placeholder="0"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>原料总成本</label><input type="number" class="form-control" id="procMaterialPrice" min="0" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>包材总成本</label><input type="number" class="form-control" id="procPackagingPrice" min="0" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>工费总额</label><input type="number" class="form-control" id="procLaborCost" min="0" step="0.01" placeholder="0.00"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#8b5cf6">保存</button>
        </form>
      </div>
    </div>

    <!-- 运输端弹窗 - 提货 -->
    <div id="pickupModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePickupModal()">
      <div class="modal-content" style="max-width:500px">
        <button class="modal-close" onclick="closePickupModal()">✕</button>
        <h3 style="margin-bottom:16px">🚚 新增提货</h3>
        <form onsubmit="savePickup(event)">
          <div class="form-group">
            <label>选择订单批次号 <span style="color:var(--danger)">*</span></label>
            <input type="text" class="form-control" id="pickupBatchSearch" placeholder="输入关键字搜索订单批次号..." oninput="searchBatch(this.value)" autocomplete="off">
            <div id="batchSearchResults" style="display:none;position:absolute;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;width:calc(100% - 32px);margin-top:4px"></div>
            <input type="hidden" id="pickupBatchNo">
            <div id="selectedBatchInfo" style="display:none;margin-top:8px;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>提货数量 <span style="color:var(--danger)">*</span></label><input type="number" class="form-control" id="pickupQty" min="1" step="1" required placeholder="0" oninput="updatePickupNo()"></div>
            <div class="form-group"><label>体积(m³)</label><input type="number" class="form-control" id="pickupVolume" min="0" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>重量(kg)</label><input type="number" class="form-control" id="pickupWeight" min="0" step="0.01" placeholder="0.00"></div>
          </div>
          <div class="form-group">
            <label>提货号（自动生成）</label>
            <input type="text" class="form-control" id="pickupNo" readonly style="background:var(--bg)">
          </div>
          <button type="submit" class="btn btn-primary" style="background:#f59e0b">保存</button>
        </form>
      </div>
    </div>

    <!-- 运输端弹窗 - 费用 -->
    <div id="shipExpenseModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeShipExpenseModal()">
      <div class="modal-content" style="max-width:500px">
        <button class="modal-close" onclick="closeShipExpenseModal()">✕</button>
        <h3 style="margin-bottom:16px">💰 新增费用</h3>
        <form onsubmit="saveShipExpense(event)">
          <div class="form-group">
            <label>费用批次号</label>
            <input type="text" class="form-control" id="expenseNo" readonly style="background:var(--bg);font-family:monospace;font-weight:600">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>费用类型 <span style="color:var(--danger)">*</span></label>
              <select class="form-control" id="feeType" required>
                <option value="">请选择</option>
                <option value="货车运费">货车运费</option>
                <option value="杂费">杂费</option>
                <option value="海运费">海运费</option>
                <option value="仓储费">仓储费</option>
              </select>
            </div>
            <div class="form-group"><label>金额 <span style="color:var(--danger)">*</span></label><input type="number" class="form-control" id="expenseAmount" min="0.01" step="0.01" required placeholder="0.00"></div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1">
              <label>提货号</label>
              <select class="form-control" id="expensePickupNo">
                <option value="">不关联</option>
              </select>
            </div>
            <div class="form-group" style="flex:none;display:flex;align-items:flex-end">
              <button type="button" class="btn btn-outline" onclick="closeShipExpenseModal();openPickupModal()" style="white-space:nowrap;font-size:12px;padding:6px 12px">+ 添加提货号</button>
            </div>
          </div>
          <div class="form-group">
            <label>计算方式</label>
            <select class="form-control" id="calcMethod">
              <option value="">不指定</option>
              <option value="体积">体积</option>
              <option value="重量">重量</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#6366f1">保存</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/app.js?v=22"></script>
</body>
</html>
