<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>批次成本管理</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tabs { display:flex;gap:4px;margin-bottom:16px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow) }
    .tab { flex:1;padding:12px;text-align:center;border:none;background:transparent;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text-secondary);font-family:inherit;transition:.2s }
    .tab.active { background:var(--primary);color:#fff }
    .tab:hover:not(.active) { background:var(--bg) }
    .tab-content { display:none }
    .tab-content.active { display:block }
    .batch-card { background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s;margin-bottom:10px }
    .batch-card:hover { box-shadow:var(--shadow-lg) }
    .batch-card .top-row { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px }
    .batch-card .name { font-size:16px;font-weight:700 }
    .batch-card .info-row { font-size:13px;color:var(--text-secondary);margin:3px 0 }
    .batch-card .cost-row { display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 }
    .batch-card .cost-row span { font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--text-secondary) }
    .batch-card .total-line { display:flex;gap:18px;margin:4px 0;font-size:14px }
    .batch-card .actions { display:flex;gap:8px;margin-top:6px;justify-content:flex-end }
    .product-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px }
    .stats-bar { display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap }
    .stat-card { background:var(--card);border-radius:var(--radius);padding:12px 16px;text-align:center;box-shadow:var(--shadow);flex:1;min-width:100px }
    .stat-card .num { font-size:22px;font-weight:700 }
    .stat-card .label { font-size:11px;color:var(--text-secondary);margin-top:2px }
    .prod-table { width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow) }
    .prod-table th { background:#0891b2;color:#fff;padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap }
    .prod-table td { padding:8px;border-bottom:1px solid var(--border);white-space:nowrap }
    .prod-table tr:hover td { background:#f0f9ff }
    .prod-table .num-col { text-align:right;font-variant-numeric:tabular-nums }
    @media (max-width:600px) { .product-grid { grid-template-columns:1fr } }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 批次成本管理</h1>
    <p>录入生产批次信息，自动核算单位成本</p>
  </div>

  <div class="container-wide" id="app">

    <!-- 搜索 -->
    <div class="search-bar" style="margin-bottom:14px">
      <input type="text" class="form-control" id="searchInput" placeholder="搜索批次编码 / 品名 / 批次..." oninput="onSearch()">
    </div>

    <!-- 标签页 -->
    <div class="tabs">
      <button class="tab active" data-tab="summary" onclick="switchTab('summary')"><span class="icon">📊</span>汇总</button>
      <button class="tab" data-tab="procurement" onclick="switchTab('procurement')"><span class="icon">🛒</span>采购端</button>
      <button class="tab" data-tab="production" onclick="switchTab('production')"><span class="icon">🏭</span>生产端</button>
      <button class="tab" data-tab="shipping" onclick="switchTab('shipping')"><span class="icon">🚚</span>运输端</button>
      <button class="tab" data-tab="management" onclick="switchTab('management')"><span class="icon">⚙️</span>管理端</button>
    </div>

    <!-- 汇总（只看数据） -->
    <div id="tabSummary" class="tab-content active">
      <div class="stats-bar" id="summaryStats"></div>
      <div id="summaryList" class="product-grid" style="display:none"></div>
    </div>

    <!-- 采购端 -->
    <div id="tabProcurement" class="tab-content">
      <div class="stats-bar" id="procStats"></div>
      <div id="procList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
        <button class="btn btn-sm btn-primary" onclick="openProcAdd()" style="width:auto;padding:10px 24px;background:#8b5cf6">➕ 新增采购</button>
        <button class="btn btn-sm btn-outline" onclick="exportProcCSV()" style="width:auto;padding:10px 24px">📤 导出CSV</button>
      </div>
    </div>

    <!-- 生产端（表格+新增） -->
    <div id="tabProduction" class="tab-content">
      <div class="stats-bar" id="prodStats"></div>
      <div id="prodList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
        <button class="btn btn-sm btn-primary" onclick="openAdd()" style="width:auto;padding:10px 24px">➕ 新增批次</button>
        <button class="btn btn-sm btn-outline" onclick="exportCSV()" style="width:auto;padding:10px 24px">📤 导出CSV</button>
      </div>
    </div>

    <!-- 运输端 -->
    <div id="tabShipping" class="tab-content">
      <div class="stats-bar" id="shipStats"></div>
      <div id="shipList" class="product-grid"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
        <button class="btn btn-sm btn-primary" onclick="openShipModal()" style="width:auto;padding:10px 24px;background:#f59e0b">➕ 新增费用</button>
      </div>
    </div>

    <!-- 管理端 -->
    <div id="tabManagement" class="tab-content">
      <div class="stats-bar" id="mgmtStats"></div>
      <div class="mgmt-grid">
        <div class="mgmt-card">
          <h3>📋 费用审批</h3>
          <div id="approvalList"></div>
        </div>
        <div class="mgmt-card">
          <h3>📊 数据统计</h3>
          <div id="dataStats"></div>
        </div>
        <div class="mgmt-card">
          <h3>⚙️ 系统设置</h3>
          <div id="sysSettings"></div>
        </div>
      </div>
    </div>

    <!-- 运输端新增费用弹窗 -->
    <div id="shipModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeShipModal()">
      <div class="modal-content" style="max-width:450px">
        <button class="modal-close" onclick="closeShipModal()">✕</button>
        <h3 style="margin-bottom:16px">🚚 新增运输费用</h3>
        <form onsubmit="saveShipExpense(event)">
          <input type="hidden" id="shipEditId">
          <div class="form-group"><label>费用说明 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="shipDesc" required placeholder="如: 快递费、物流费"></div>
          <div class="form-row">
            <div class="form-group"><label>金额 <span style="color:var(--danger)">*</span></label><input type="number" class="form-control" id="shipAmount" step="0.01" required placeholder="0.00"></div>
            <div class="form-group"><label>日期</label><input type="date" class="form-control" id="shipDate"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#f59e0b">保存</button>
        </form>
      </div>
    </div>

    <!-- 采购端新增弹窗 -->
    <div id="procModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeProcModal()">
      <div class="modal-content" style="max-width:600px">
        <button class="modal-close" onclick="closeProcModal()">✕</button>
        <h3 style="margin-bottom:16px">🛒 新增采购记录</h3>
        <form onsubmit="saveProcurement(event)">
          <input type="hidden" id="procEditId">
          <div class="form-row">
            <div class="form-group"><label>采购日期</label><input type="date" class="form-control" id="procDate"></div>
            <div class="form-group"><label>供应商 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procSupplier" required placeholder="供应商名称"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>原材料名称 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procMaterial" required placeholder="原材料名称"></div>
            <div class="form-group"><label>规格</label><input type="text" class="form-control" id="procSpec" placeholder="规格型号"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>数量</label><input type="number" class="form-control" id="procQty" step="1" placeholder="0" oninput="calcProcPreview()"></div>
            <div class="form-group"><label>单位</label><input type="text" class="form-control" id="procUnit" placeholder="如: 个、kg"></div>
            <div class="form-group"><label>单价</label><input type="number" class="form-control" id="procPrice" step="0.01" placeholder="0.00" oninput="calcProcPreview()"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>关联批次号</label><input type="text" class="form-control" id="procBatchCode" placeholder="关联批次号"></div>
            <div class="form-group"><label>状态</label>
              <select class="form-control" id="procStatus">
                <option value="pending">待审批</option>
                <option value="approved">已审批</option>
                <option value="received">已入库</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label>备注</label><textarea class="form-control" id="procNotes" rows="2" placeholder="备注信息"></textarea></div>
          <div class="preview-bar" style="background:#f5f3ff;border-radius:8px;padding:10px;text-align:center;font-size:15px;margin-bottom:12px">
            总金额: <strong id="procTotalDisplay" style="color:#8b5cf6">¥0.00</strong>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#8b5cf6">保存</button>
        </form>
      </div>
    </div>

    <!-- 分页 -->
    <div class="pagination" style="margin-top:16px">
      <button class="page-btn" id="prevPage" onclick="changePage(-1)">← 上一页</button>
      <span class="page-info" id="pageInfo">第 1 页</span>
      <button class="page-btn" id="nextPage" onclick="changePage(1)">下一页 →</button>
    </div>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div id="batchModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" style="max-width:650px">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3 id="modalTitle">新增批次</h3>
      <form id="batchForm" onsubmit="saveBatch(event)">
        <input type="hidden" id="editId">

        <!-- 生产端 -->
        <div style="border:2px solid #0891b2;border-radius:10px;padding:14px;margin-bottom:12px">
          <h4 style="font-size:14px;margin-bottom:10px;color:#0891b2">🏭 生产端</h4>
          <div class="form-row">
            <div class="form-group"><label style="font-size:13px">批次编码</label><input type="text" class="form-control" id="f_batchCode" placeholder="如: B20260701"></div>
            <div class="form-group"><label style="font-size:13px">品名 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="f_productName" required placeholder="产品名称"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label style="font-size:13px">批次 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="f_batch" required placeholder="如: 202607-01"></div>
            <div class="form-group"><label style="font-size:13px">数量</label><input type="number" class="form-control" id="f_quantity" step="1" placeholder="生产数量" oninput="calcPreview()"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label style="font-size:13px">原料费</label><input type="number" class="form-control" id="f_materialCost" step="0.01" placeholder="0" oninput="calcPreview()"></div>
            <div class="form-group"><label style="font-size:13px">包材费</label><input type="number" class="form-control" id="f_packagingCost" step="0.01" placeholder="0" oninput="calcPreview()"></div>
            <div class="form-group"><label style="font-size:13px">工费</label><input type="number" class="form-control" id="f_laborCost" step="0.01" placeholder="0" oninput="calcPreview()"></div>
            <div class="form-group"><label style="font-size:13px">损耗</label><input type="number" class="form-control" id="f_wastage" step="0.01" placeholder="0" oninput="calcPreview()"></div>
            <div class="form-group"><label style="font-size:13px">开模费</label><input type="number" class="form-control" id="f_moldCost" step="0.01" placeholder="0" oninput="calcPreview()"></div>
            <div class="form-group"><label style="font-size:13px">运费</label><input type="number" class="form-control" id="f_shippingCost" step="0.01" placeholder="0" oninput="calcPreview()"></div>
          </div>
          <div class="form-group" style="margin-top:8px">
            <label style="font-size:13px">📎 附件</label>
            <input type="file" class="form-control" id="f_attachment" style="padding:8px;font-size:13px" onchange="onFileSelect()">
            <div id="fileInfo" style="font-size:12px;color:var(--text-secondary);margin-top:4px;display:none"></div>
            <input type="hidden" id="f_attachmentData">
            <input type="hidden" id="f_attachmentName">
          </div>
        </div>

        <div class="preview-bar" style="background:#f0f9ff;border-radius:8px;padding:10px;text-align:center;font-size:15px;margin-bottom:12px">
          总成本: <strong id="totalDisplay" style="color:#0891b2">¥0.00</strong>
          &nbsp;&nbsp;|&nbsp;&nbsp;
          单位成本: <strong id="unitDisplay" style="color:var(--warning)">¥0.00</strong>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js?v=4"></script>
</body>
</html>
