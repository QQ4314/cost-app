<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>批次成本管理</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tabs { display:flex;gap:4px;margin-bottom:16px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow) }
    .tab { flex:1;padding:12px;text-align:center;border:none;background:transparent;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text-secondary);font-family:inherit;transition:.2s }
    .tab.active { background:var(--primary);color:#fff }
    .tab:hover:not(.active) { background:var(--bg) }
    .tab-content { display:none }
    .tab-content.active { display:block }
    .batch-card { background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s;margin-bottom:10px }
    .batch-card:hover { box-shadow:var(--shadow-lg) }
    .batch-card .top-row { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px }
    .batch-card .name { font-size:16px;font-weight:700 }
    .batch-card .info-row { font-size:13px;color:var(--text-secondary);margin:3px 0 }
    .batch-card .cost-row { display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 }
    .batch-card .cost-row span { font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--text-secondary) }
    .batch-card .total-line { display:flex;gap:18px;margin:4px 0;font-size:14px }
    .batch-card .actions { display:flex;gap:8px;margin-top:6px;justify-content:flex-end }
    .product-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px }
    .stats-bar { display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap }
    .stat-card { background:var(--card);border-radius:var(--radius);padding:12px 16px;text-align:center;box-shadow:var(--shadow);flex:1;min-width:100px }
    .stat-card .num { font-size:22px;font-weight:700 }
    .stat-card .label { font-size:11px;color:var(--text-secondary);margin-top:2px }
    .prod-table { width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow) }
    .prod-table th { background:#0891b2;color:#fff;padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap }
    .prod-table td { padding:8px;border-bottom:1px solid var(--border);white-space:nowrap }
    .prod-table tr:hover td { background:#f0f9ff }
    .prod-table .num-col { text-align:right;font-variant-numeric:tabular-nums }
    @media (max-width:600px) { .product-grid { grid-template-columns:1fr } }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 批次成本管理</h1>
    <p>录入生产批次信息，自动核算单位成本</p>
  </div>

  <div class="container-wide" id="app">

    <!-- 标签页 -->
    <div class="tabs">
      <button class="tab active" data-tab="procurement" onclick="switchTab('procurement')"><span class="icon">🛒</span>采购端</button>
      <button class="tab" data-tab="shipping" onclick="switchTab('shipping')"><span class="icon">🚚</span>运输端</button>
      <button class="tab" data-tab="management" onclick="switchTab('management')"><span class="icon">⚙️</span>管理端</button>
    </div>

    <!-- 采购端 -->
    <div id="tabProcurement" class="tab-content active">
      <div class="stats-bar" id="procStats"></div>
      <div id="procList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
        <button class="btn btn-sm btn-primary" onclick="openProcAdd()" style="width:auto;padding:10px 24px;background:#8b5cf6">➕ 新增采购</button>
        <button class="btn btn-sm btn-outline" onclick="exportProcCSV()" style="width:auto;padding:10px 24px">📤 导出Excel</button>
      </div>
    </div>

    <!-- 运输端 -->
    <div id="tabShipping" class="tab-content">
      <div class="stats-bar" id="shipStats"></div>
      <div id="shipList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" onclick="openPickupModal()" style="width:auto;padding:10px 20px;background:#f59e0b">➕ 新增提货</button>
        <button class="btn btn-sm btn-primary" onclick="openPickupBatchModal()" style="width:auto;padding:10px 20px;background:#10b981">📦 新增提货批次</button>
        <button class="btn btn-sm btn-primary" onclick="openShipExpenseModal()" style="width:auto;padding:10px 20px;background:#6366f1">💰 新增费用</button>
      </div>
    </div>

    <!-- 管理端 -->
    <div id="tabManagement" class="tab-content">
      <div class="stats-bar" id="mgmtStats"></div>
      <div class="mgmt-grid">
        <div class="mgmt-card">
          <h3>☁️ 云端同步</h3>
          <div id="cloudSync"></div>
        </div>
        <div class="mgmt-card">
          <h3>📊 数据统计</h3>
          <div id="dataStats"></div>
        </div>
        <div class="mgmt-card">
          <h3>⚙️ 系统设置</h3>
          <div id="sysSettings"></div>
        </div>
      </div>
    </div>

    <!-- 新增提货弹窗 -->
    <div id="pickupModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePickupModal()">
      <div class="modal-content" style="max-width:500px">
        <button class="modal-close" onclick="closePickupModal()">✕</button>
        <h3 style="margin-bottom:16px">🚚 新增提货</h3>
        <form onsubmit="savePickup(event)">
          <div class="form-group">
            <label>选择批次号 <span style="color:var(--danger)">*</span></label>
            <input type="text" class="form-control" id="pickupBatchSearch" placeholder="输入关键字搜索批次号..." oninput="searchBatch(this.value)" autocomplete="off">
            <div id="batchSearchResults" style="display:none;position:absolute;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;width:calc(100% - 32px);margin-top:4px"></div>
            <input type="hidden" id="pickupBatchNo">
            <div id="selectedBatchInfo" style="display:none;margin-top:8px;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>提货数量 <span style="color:var(--danger)">*</span></label><input type="number" class="form-control" id="pickupQty" step="1" required placeholder="0" oninput="updatePickupNo()"></div>
          </div>
          <div class="form-group">
            <label>提货号（自动生成）</label>
            <input type="text" class="form-control" id="pickupNo" readonly style="background:var(--bg)">
          </div>
          <button type="submit" class="btn btn-primary" style="background:#f59e0b">保存</button>
        </form>
      </div>
    </div>

    <!-- 新增提货批次弹窗 -->
    <div id="pickupBatchModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePickupBatchModal()">
      <div class="modal-content" style="max-width:700px">
        <button class="modal-close" onclick="closePickupBatchModal()">✕</button>
        <h3 style="margin-bottom:16px">📦 新增提货批次</h3>
        <form onsubmit="savePickupBatch(event)">
          <div class="form-row">
            <div class="form-group"><label>提货日期 <span style="color:var(--danger)">*</span></label><input type="date" class="form-control" id="pickupBatchDate" required></div>
          </div>
          <div class="form-group">
            <label>选择提货号 <span style="color:var(--danger)">*</span></label>
            <input type="text" class="form-control" id="pickupNoSearch" placeholder="输入关键字搜索提货号..." oninput="searchPickupNo(this.value)" autocomplete="off">
            <div id="pickupNoSearchResults" style="display:none;position:absolute;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;width:calc(100% - 32px);margin-top:4px"></div>
          </div>
          <div id="selectedPickups" style="margin:12px 0"></div>
          <div class="form-group">
            <label>提货批次号（点击生成）</label>
            <div style="display:flex;gap:8px">
              <input type="text" class="form-control" id="pickupBatchNo" readonly style="background:var(--bg);flex:1">
              <button type="button" class="btn btn-sm btn-primary" onclick="generatePickupBatchNo()" style="background:#10b981;white-space:nowrap">生成批次号</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#10b981">保存</button>
        </form>
      </div>
    </div>

    <!-- 新增费用弹窗 -->
    <div id="shipExpenseModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeShipExpenseModal()">
      <div class="modal-content" style="max-width:500px">
        <button class="modal-close" onclick="closeShipExpenseModal()">✕</button>
        <h3 style="margin-bottom:16px">💰 新增费用</h3>
        <form onsubmit="saveShipExpense(event)">
          <div class="form-group">
            <label>选择提货批次号 <span style="color:var(--danger)">*</span></label>
            <select class="form-control" id="expenseBatchNo" required>
              <option value="">请选择提货批次号</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group"><label>货车运费</label><input type="number" class="form-control" id="truckFee" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>杂费</label><input type="number" class="form-control" id="miscFee" step="0.01" placeholder="0.00"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>海运费</label><input type="number" class="form-control" id="oceanFee" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>仓储费</label><input type="number" class="form-control" id="storageFee" step="0.01" placeholder="0.00"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#6366f1">保存</button>
        </form>
      </div>
    </div>

    <!-- 采购端新增弹窗 -->
    <div id="procModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeProcModal()">
      <div class="modal-content" style="max-width:600px">
        <button class="modal-close" onclick="closeProcModal()">✕</button>
        <h3 style="margin-bottom:16px">🛒 新增采购记录</h3>
        <form onsubmit="saveProcurement(event)">
          <input type="hidden" id="procEditId">
          <div class="form-row">
            <div class="form-group"><label>下单日期</label><input type="date" class="form-control" id="procDate"></div>
            <div class="form-group"><label>品牌 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procBrand" required placeholder="品牌名称"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>品名 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procProductName" required placeholder="产品名称"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>下单数量</label><input type="number" class="form-control" id="procOrderQty" step="1" placeholder="0"></div>
            <div class="form-group"><label>产出数量</label><input type="number" class="form-control" id="procOutputQty" step="1" placeholder="0"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>原料价格</label><input type="number" class="form-control" id="procMaterialPrice" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>包材价格</label><input type="number" class="form-control" id="procPackagingPrice" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>工费</label><input type="number" class="form-control" id="procLaborCost" step="0.01" placeholder="0.00"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#8b5cf6">保存</button>
        </form>
      </div>
    </div>

    <!-- 分页 -->
    <div class="pagination" style="margin-top:16px">
      <button class="page-btn" id="prevPage" onclick="changePage(-1)">← 上一页</button>
      <span class="page-info" id="pageInfo">第 1 页</span>
      <button class="page-btn" id="nextPage" onclick="changePage(1)">下一页 →</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/app.js?v=8=7"></script>
</body>
</html>
