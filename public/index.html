<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>采购端 - 批次成本管理</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-tabs { display:flex;gap:4px;margin-bottom:16px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow) }
    .nav-tab { flex:1;padding:12px;text-align:center;text-decoration:none;background:transparent;border-radius:10px;font-size:15px;font-weight:600;color:var(--text-secondary);font-family:inherit;transition:.2s }
    .nav-tab.active { background:var(--primary);color:#fff }
    .nav-tab:hover:not(.active) { background:var(--bg) }
    .batch-card { background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s;margin-bottom:10px }
    .batch-card:hover { box-shadow:var(--shadow-lg) }
    .batch-card .top-row { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px }
    .batch-card .name { font-size:16px;font-weight:700 }
    .batch-card .info-row { font-size:13px;color:var(--text-secondary);margin:3px 0 }
    .batch-card .cost-row { display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 }
    .batch-card .cost-row span { font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--text-secondary) }
    .batch-card .total-line { display:flex;gap:18px;margin:4px 0;font-size:14px }
    .batch-card .actions { display:flex;gap:8px;margin-top:6px;justify-content:flex-end }
    .product-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px }
    .stats-bar { display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap }
    .stat-card { background:var(--card);border-radius:var(--radius);padding:12px 16px;text-align:center;box-shadow:var(--shadow);flex:1;min-width:100px }
    .stat-card .num { font-size:22px;font-weight:700 }
    .stat-card .label { font-size:11px;color:var(--text-secondary);margin-top:2px }
    .prod-table { width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow) }
    .prod-table th { background:#0891b2;color:#fff;padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap }
    .prod-table td { padding:8px;border-bottom:1px solid var(--border);white-space:nowrap }
    .prod-table tr:hover td { background:#f0f9ff }
    .prod-table .num-col { text-align:right;font-variant-numeric:tabular-nums }
    @media (max-width:600px) { .product-grid { grid-template-columns:1fr } }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 批次成本管理</h1>
    <p>录入生产批次信息，自动核算单位成本</p>
  </div>

  <div class="container-wide" id="app">

    <!-- 导航 -->
    <div class="nav-tabs">
      <a class="nav-tab active" href="index.html">🛒 采购端</a>
      <a class="nav-tab" href="shipping.html">🚚 运输端</a>
      <a class="nav-tab" href="management.html">⚙️ 管理端</a>
    </div>

    <!-- 采购端内容 -->
    <div id="pageContent">
      <div class="stats-bar" id="procStats"></div>
      <div id="procList"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
        <button class="btn btn-sm btn-primary" onclick="openProcAdd()" style="width:auto;padding:10px 24px;background:#8b5cf6">➕ 新增采购</button>
        <button class="btn btn-sm btn-outline" onclick="exportProcCSV()" style="width:auto;padding:10px 24px">📤 导出Excel</button>
      </div>
    </div>

    <!-- 采购端新增弹窗 -->
    <div id="procModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeProcModal()">
      <div class="modal-content" style="max-width:600px">
        <button class="modal-close" onclick="closeProcModal()">✕</button>
        <h3 style="margin-bottom:16px">🛒 新增采购记录</h3>
        <form onsubmit="saveProcurement(event)">
          <input type="hidden" id="procEditId">
          <div class="form-row">
            <div class="form-group"><label>下单日期</label><input type="date" class="form-control" id="procDate"></div>
            <div class="form-group"><label>品牌 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procBrand" required placeholder="品牌名称"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>品名 <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" id="procProductName" required placeholder="产品名称"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>下单数量</label><input type="number" class="form-control" id="procOrderQty" step="1" placeholder="0"></div>
            <div class="form-group"><label>产出数量</label><input type="number" class="form-control" id="procOutputQty" step="1" placeholder="0"></div>
          </div>
          <div class="form-row form-row-3">
            <div class="form-group"><label>原料价格</label><input type="number" class="form-control" id="procMaterialPrice" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>包材价格</label><input type="number" class="form-control" id="procPackagingPrice" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>工费</label><input type="number" class="form-control" id="procLaborCost" step="0.01" placeholder="0.00"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="background:#8b5cf6">保存</button>
        </form>
      </div>
    </div>

    <!-- 分页 -->
    <div class="pagination" style="margin-top:16px">
      <button class="page-btn" id="prevPage" onclick="changePage(-1)">← 上一页</button>
      <span class="page-info" id="pageInfo">第 1 页</span>
      <button class="page-btn" id="nextPage" onclick="changePage(1)">下一页 →</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
