<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>管理端 - 批次成本管理</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-tabs { display:flex;gap:4px;margin-bottom:16px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow) }
    .nav-tab { flex:1;padding:12px;text-align:center;text-decoration:none;background:transparent;border-radius:10px;font-size:15px;font-weight:600;color:var(--text-secondary);font-family:inherit;transition:.2s }
    .nav-tab.active { background:var(--primary);color:#fff }
    .nav-tab:hover:not(.active) { background:var(--bg) }
    .stats-bar { display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap }
    .stat-card { background:var(--card);border-radius:var(--radius);padding:12px 16px;text-align:center;box-shadow:var(--shadow);flex:1;min-width:100px }
    .stat-card .num { font-size:22px;font-weight:700 }
    .stat-card .label { font-size:11px;color:var(--text-secondary);margin-top:2px }
    .mgmt-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px }
    .mgmt-card { background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow) }
    .mgmt-card h3 { margin:0 0 12px;font-size:16px }
    .version-info { text-align:center;color:var(--text-secondary);font-size:12px;margin-top:16px }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 批次成本管理</h1>
    <p>录入生产批次信息，自动核算单位成本</p>
  </div>

  <div class="container-wide" id="app">

    <!-- 导航 -->
    <div class="nav-tabs">
      <a class="nav-tab" href="index.html">🛒 采购端</a>
      <a class="nav-tab" href="shipping.html">🚚 运输端</a>
      <a class="nav-tab active" href="management.html">⚙️ 管理端</a>
    </div>

    <!-- 管理端内容 -->
    <div id="pageContent">
      <div class="stats-bar" id="mgmtStats"></div>
      <div class="mgmt-grid">
        <div class="mgmt-card">
          <h3>☁️ 云端同步</h3>
          <div id="cloudSync"></div>
        </div>
        <div class="mgmt-card">
          <h3>📊 数据统计</h3>
          <div id="dataStats"></div>
        </div>
        <div class="mgmt-card">
          <h3>⚙️ 系统设置</h3>
          <div id="sysSettings"></div>
        </div>
      </div>
      <div class="version-info">批次成本管理 v2.3</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js?v=13"></script>
</body>
</html>
